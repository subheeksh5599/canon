[project]
name = "canon"
version = "0.1.0"
description = "The exchange where agents transact under terms the economy itself writes."
requires-python = ">=3.10"
dependencies = ["sibyl-memory-client>=0.8.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["canon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
